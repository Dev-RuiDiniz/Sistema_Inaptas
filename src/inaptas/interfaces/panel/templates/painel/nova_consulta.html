{% extends "painel/base.html" %}
{% block title %}Nova consulta — Sistema Inaptas{% endblock %}
{% block body %}<main class="app-shell"><header class="topbar"><a class="brand" href="/painel">Sistema Inaptas</a></header><section class="content narrow"><p class="eyebrow">Consulta manual</p><h1>Verificar CNPJ</h1><p class="lede">O resultado preservará fonte, horário, latência e indisponibilidades.</p>{% if erro %}<p class="alert alert-error" role="alert">{{ erro }}</p>{% endif %}<form method="post" class="panel form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="cnpj">CNPJ<input id="cnpj" name="cnpj" value="{{ cnpj|default("") }}" inputmode="text" autocomplete="off" required></label><button class="button button-primary" type="submit">Consultar</button></form></section></main>{% endblock %}
