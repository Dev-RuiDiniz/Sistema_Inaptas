{% extends "painel/base.html" %}
{% block title %}Configurações — Sistema Inaptas{% endblock %}
{% block body %}<main class="app-shell"><header class="topbar"><a class="brand" href="/painel">Sistema Inaptas</a><a href="/painel/admin/usuarios">Usuários</a></header><section class="content narrow"><p class="eyebrow">Administração</p><h1>Retenção de consultas</h1><section class="panel"><form method="post" action="/painel/admin/configuracoes/retencao" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="retention_days">Dias de retenção<input id="retention_days" name="retention_days" type="number" min="1" max="3650" value="{{ retention_days }}" required></label><button class="button button-primary" data-confirm="Alterar a retenção do escritório?" type="submit">Salvar retenção</button></form></section></section></main>{% endblock %}
